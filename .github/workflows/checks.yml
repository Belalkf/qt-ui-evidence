name: Synthetic Qt checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  qt-offscreen:
    runs-on: macos-14
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - run: python -m pip install PySide6==6.10.3
      - run: python -m unittest discover -s tests -t . -v
        env:
          QT_QPA_PLATFORM: offscreen
